name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The README advertises all three desktop platforms, so build on all three.
        # Ubuntu is pinned: the ubuntu-latest label migrates to Ubuntu 26 on 2026-10-19,
        # and with -warnaserror an image-driven SDK bump could redden a build we never touched.
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GraphMailSender.slnx

      - name: Build
        run: dotnet build GraphMailSender.slnx --configuration Release --no-restore -warnaserror
